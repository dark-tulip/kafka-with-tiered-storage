startDelaySeconds: 0
whitelistObjectNames:
  - "*:*"

rules:
  # jvm_threads_count
  - pattern: 'java\.lang<type=Threading><>ThreadCount'
    name: jvm_threads_count
    type: GAUGE

  # ---------- Broker traffic (OneMinuteRate) ----------
  # BytesIn/BytesOut total по брокеру
  - pattern: 'kafka\.server<type=BrokerTopicMetrics, name=(BytesInPerSec|BytesOutPerSec)><>OneMinuteRate'
    name: kafka_broker_bytes_rate
    labels:
      direction: "$1"
    type: GAUGE

  # MessagesInPerSec per-topic
  - pattern: 'kafka\.server<type=BrokerTopicMetrics, name=MessagesInPerSec, topic=([a-zA-Z0-9\._-]+)><>OneMinuteRate'
    name: kafka_broker_messages_in_rate
    labels:
      topic: "$1"
    type: GAUGE

  # ---------- Quorum Controller (Унифицировано) ----------
  # Ловит все метрики Value из kafka.controller (QuorumControllerMetrics, KafkaController)
  - pattern: 'kafka\.controller<type=[^,]+(?:, node-id=([0-9]+))?(?:,.*)?, name=([A-Za-z0-9_.-]+)><>Value'
    name: kafka_controller_value
    labels:
      node_id: "$1"
      metric: "$2"
    type: GAUGE

  # ---------- Универсальный fallback для всех kafka.* c Value  ----------
  # Отсюда приедут: UnderReplicatedPartitions, OfflinePartitionsCount, NetworkProcessorAvgIdlePercent и т.д.
  - pattern: 'kafka\.[^<]+<type=[^,>]+(?:,[^>]+)?, name=([A-Za-z0-9_.-]+)><>Value'
    name: kafka_$1
    type: GAUGE

  # Примеры метрик RSM:
  - pattern: 'aiven\.kafka\.server\.tieredstorage<type=remote-storage-manager-metrics><>object-upload-bytes-rate'
    name: aiven_tiered_object_upload_bytes_rate
    type: GAUGE

  - pattern: 'aiven\.kafka\.server\.tieredstorage<type=remote-storage-manager-metrics><>object-upload-rate'
    name: aiven_tiered_object_upload_rate
    type: GAUGE

  - pattern: 'aiven\.kafka\.server\.tieredstorage<type=remote-storage-manager-metrics><>object-upload-bytes-total'
    name: aiven_tiered_object_upload_bytes_total
    type: GAUGE

