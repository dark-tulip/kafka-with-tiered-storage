global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kafka-brokers-jmx'
    static_configs:
      - targets: ['kafka-1:9094','kafka-2:9094','kafka-3:9094']
        labels:
          job: kafka
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
