version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - ./minio/data:/data

  create-minio-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh","-c"]
    command: >-
      "mc alias set local http://minio:9000 minioadmin minioadmin123 &&
       mc mb -p local/kafka-remote || true &&
       mc anonymous set public local/kafka-remote || true"

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    depends_on: [minio, create-minio-bucket]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # --- Tiered Storage (cluster-level enablement) ---
      KAFKA_REMOTE_LOG_STORAGE_SYSTEM_ENABLE: "true"
      # RLMM (default is TopicBasedRemoteLogMetadataManager)
      KAFKA_REMOTE_LOG_METADATA_MANAGER_CLASS_NAME: org.apache.kafka.server.log.remote.metadata.storage.TopicBasedRemoteLogMetadataManager
      KAFKA_REMOTE_LOG_METADATA_MANAGER_LISTENER_NAME: PLAINTEXT
      # Single-node demo tweak so metadata topic can be created
      KAFKA_RLMM_CONFIG_REMOTE_LOG_METADATA_TOPIC_REPLICATION_FACTOR: 1

      # --- Remote Storage Manager (Aiven plugin) ---
      KAFKA_REMOTE_LOG_STORAGE_MANAGER_CLASS_NAME: io.aiven.kafka.tieredstorage.RemoteStorageManager
      KAFKA_REMOTE_LOG_STORAGE_MANAGER_CLASS_PATH: /opt/kafka/aiven/*
      # Recommended 4MiB chunk size
      KAFKA_RSM_CONFIG_CHUNK_SIZE: 4194304

      # --- S3 backend (MinIO) ---
      KAFKA_RSM_CONFIG_STORAGE_BACKEND_CLASS: io.aiven.kafka.tieredstorage.storage.s3.S3Storage
      KAFKA_RSM_CONFIG_STORAGE_S3_BUCKET_NAME: kafka-remote
      KAFKA_RSM_CONFIG_STORAGE_S3_ENDPOINT: http://minio:9000
      KAFKA_RSM_CONFIG_STORAGE_S3_REGION: us-east-1
      KAFKA_RSM_CONFIG_STORAGE_S3_PATH_STYLE_ACCESS: "true"
      KAFKA_RSM_CONFIG_STORAGE_S3_ACCESS_KEY: minioadmin
      KAFKA_RSM_CONFIG_STORAGE_S3_SECRET_KEY: minioadmin123

      # Optional caching (disk) for remote fetches
      KAFKA_RSM_CONFIG_FETCH_CHUNK_CACHE_CLASS: io.aiven.kafka.tieredstorage.fetch.cache.DiskChunkCache
      KAFKA_RSM_CONFIG_FETCH_CHUNK_CACHE_PATH: /var/lib/kafka/cache
      KAFKA_RSM_CONFIG_FETCH_CHUNK_CACHE_SIZE: 17179869184  # 16GiB

      # Faster demo effect
      KAFKA_REMOTE_LOG_MANAGER_TASK_INTERVAL_MS: 5000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000

      # JMX for jmx_exporter (remote access still allowed; exporter ignores it)
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_OPTS: -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.local.only=false -Djava.rmi.server.hostname=kafka -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false

      # Attach jmx_exporter javaagent (serves at :7071 inside container)
      KAFKA_OPTS: -javaagent:/opt/jmx/jmx_prometheus_javaagent-1.0.1.jar=7071:/opt/jmx/jmx-exporter-config.yml
    ports:
      - "9092:9092"
      - "7071:7071"   # JMX exporter HTTP
    volumes:
      - ./kafka/data:/var/lib/kafka/data
      - ./kafka/server.properties:/opt/kafka/config/server.properties
      - ./kafka/jmx:/opt/jmx
      - ./kafka/aiven:/opt/kafka/aiven
    command: ["bash","-lc","if [ ! -f /var/lib/kafka/data/meta.properties ]; then /opt/kafka/bin/kafka-storage.sh format -t ${KAFKA_CLUSTER_ID:-$(/opt/kafka/bin/kafka-storage.sh random-uuid)} -c /opt/kafka/config/server.properties; fi; exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/server.properties"]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    depends_on: [kafka]
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.4.4
    container_name: grafana
    depends_on: [prometheus]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
