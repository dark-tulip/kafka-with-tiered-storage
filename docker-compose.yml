version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data

  create-minio-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh","-c"]
    command: >-
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/kafka-remote || true &&
      mc anonymous set public local/kafka-remote || true

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    depends_on:
      - minio
      - create-minio-bucket
    # только JMX/агент в env; ВСЁ остальное в server.properties
    environment:
      KAFKA_JMX_PORT: "9999"
      KAFKA_JMX_OPTS: >-
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.local.only=false
        -Djava.rmi.server.hostname=kafka
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
      KAFKA_OPTS: >-
        -javaagent:/opt/jmx/jmx_prometheus_javaagent-1.0.1.jar=7071:/opt/jmx/jmx-exporter-config.yml
    ports:
      - "9092:9092"   # Kafka PLAINTEXT
      - "7071:7071"   # JMX exporter HTTP
    volumes:
      - ./kafka/data:/var/lib/kafka/data
      - ./kafka/server.properties:/opt/kafka/config/server.properties:ro
      - ./kafka/jmx:/opt/jmx:ro
      # плагин Aiven RSM: пути совпадают со строкой class.path в server.properties
      - ./kafka/aiven/core-1.1.1:/opt/kafka/aiven/core-1.1.1:ro
      - ./kafka/aiven/s3-1.1.1:/opt/kafka/aiven/s3-1.1.1:ro
    command: >
      bash -lc '
      if [ ! -f /var/lib/kafka/data/meta.properties ]; then
        /opt/kafka/bin/kafka-storage.sh format -t ${KAFKA_CLUSTER_ID:-$(/opt/kafka/bin/kafka-storage.sh random-uuid)} -c /opt/kafka/config/server.properties;
      fi;
      exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/server.properties
      '

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    depends_on:
      - kafka
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.4.4
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
